<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>圖片情緒評分</title>
<style>
:root{--bg:#f4f5f4;--card:#fff;--ink:#1f2421;--muted:#6b726e;--line:#e2e5e3;--brand:#0a9a52;
  --font:"Inter","Segoe UI","Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:22px;margin:0 0 10px}p,li{line-height:1.7}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{background:#cfe9da;color:#4d6b5a;cursor:not-allowed}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.img{width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#ddd}.img img{width:100%;height:100%;object-fit:cover;display:block}
.q{font-weight:700;margin:14px 0 8px}
.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.pts{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pt input{position:absolute;opacity:0;pointer-events:none}
.pt span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;cursor:pointer}
.pt input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.row{display:flex;justify-content:flex-end;margin-top:14px}
.sign{color:var(--muted);font-size:14px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <section id="s-intro" class="panel">
    <h1>圖片情緒評分</h1>
    <p>接下來會出現約 30 張圖片，每張圖裡有一個人或一隻狗。請依你的第一印象，判斷圖中人物或動物看起來的情緒。</p>
    <ul><li>每張圖選一個位置，−3 是很難過，+3 是很開心，0 是看不出來。</li><li>沒有標準答案，整個過程約 3 分鐘。</li></ul>
    <p>你的作答以匿名方式記錄，只用於學術研究，你可以隨時關閉頁面退出。按下「開始」即表示你同意參加。</p>
    <button class="btn" id="go">開始</button>
    <p class="sign">政大新聞 李怡志</p>
  </section>
  <section id="s-rate" hidden>
    <div class="top"><span id="cnt"></span><span>看起來的情緒</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="panel">
      <div class="img"><img id="pic" alt=""></div>
      <div class="q" id="qtext">圖中的人物或動物看起來是什麼情緒？</div>
      <div class="ends"><span>很難過</span><span>看不出來</span><span>很開心</span></div>
      <div class="pts" id="pts"></div>
      <div class="row"><button class="btn" id="next" disabled>下一張</button></div>
    </div>
  </section>
  <section id="s-end" class="panel" hidden>
    <h1>感謝您的參與</h1>
    <p id="status"></p>
    <p>這些圖片都由 AI 生成，畫面中的人物與動物並不存在。</p>
    <div id="extra"></div>
    <p class="sign">政大新聞 李怡志</p>
  </section>
</div>
<script>
(function(){
"use strict";
// 收件：表情評分專用的 SheetMonkey form；空字串＝測試模式（結尾提供下載，不上傳）
const ENDPOINT = "";
const N_ITEMS = 30, TRAP_AT = 12;
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pid = Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, "0")).join("");
const started = new Date().toISOString();
let items = [], i = 0, shownAt = 0; const out = [];

function buildItems(stim){
  // 每張底圖 × 表情 × 遮臉（可遮的才有 eye/blur）展開，均勻抽樣：先輪底圖，避免同一個體在一人面前出現兩次
  const pool = [];
  stim.forEach(m => Object.entries(m.variants).forEach(([expr, v]) => Object.keys(v).forEach(mask =>
    pool.push({ id: m.id, cat: m.category, style: m.style, expr, mask, src: "img/" + v[mask] }))));
  const byId = {};
  shuffle(pool).forEach(p => { (byId[p.id] = byId[p.id] || []).push(p); });
  const picks = shuffle(Object.keys(byId)).slice(0, N_ITEMS).map(k => byId[k][0]);
  picks.splice(TRAP_AT, 0, { id: "TRAP", trap: true, src: picks[0].src });
  return picks;
}
function show(){
  const it = items[i];
  $("#cnt").textContent = `第 ${i + 1} / ${items.length} 張`;
  $("#prog").style.width = (i / items.length * 100) + "%";
  $("#pic").src = it.src;
  $("#qtext").textContent = it.trap ? "這一張請直接選 +3（注意力檢核）" : "圖中的人物或動物看起來是什麼情緒？";
  $("#pts").innerHTML = [-3, -2, -1, 0, 1, 2, 3].map(v => `<label class="pt"><input type="radio" name="r" value="${v}"><span>${v > 0 ? "+" + v : v}</span></label>`).join("");
  $("#next").disabled = true;
  document.querySelectorAll("#pts input").forEach(r => r.onchange = () => { $("#next").disabled = false; });
  shownAt = performance.now(); window.scrollTo(0, 0);
}
$("#next").onclick = () => {
  const it = items[i]; const v = +document.querySelector("#pts input:checked").value;
  out.push({ it, v, rt: Math.round(performance.now() - shownAt) });
  i++; if (i < items.length) show(); else finish();
};
async function finish(){
  const d = { pid, task: "expression_rating", startedAt: started, endedAt: new Date().toISOString(),
    device: innerWidth <= 640 ? "mobile" : "desktop" };
  const trap = out.find(o => o.it.trap); d.trap_pass = trap && trap.v === 3 ? "pass" : "fail";
  out.filter(o => !o.it.trap).forEach((o, k) => {
    const n = "r" + String(k + 1).padStart(2, "0");
    d[n + "_img"] = [o.it.cat, o.it.style, o.it.expr, o.it.mask, o.it.id].join("|");
    d[n + "_val"] = o.v; d[n + "_rtMs"] = o.rt;
  });
  window.RATE_LAST = d;
  $("#s-rate").hidden = true; $("#s-end").hidden = false;
  const dl = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], {type: "application/json"}));
    a.download = `rate_${pid}.json`; a.textContent = "下載作答資料（JSON）"; a.className = "btn"; a.style.display = "inline-block"; a.style.textDecoration = "none"; $("#extra").appendChild(a); };
  if (!ENDPOINT) { $("#status").textContent = "（測試模式：資料沒有上傳。）"; dl(); return; }
  try { const r = await fetch(ENDPOINT, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(d) });
    if (!r.ok) throw 0; $("#status").hidden = true; }
  catch (e) { $("#status").textContent = "作答上傳失敗，請下載作答資料後寄給研究者。"; dl(); }
}
fetch("stimuli.json").then(r => r.json()).then(s => { items = buildItems(s); }).catch(() => { $("#go").disabled = true; $("#go").textContent = "載入失敗，請重新整理"; });
$("#go").onclick = () => { if (!items.length) return; $("#s-intro").hidden = true; $("#s-rate").hidden = false; show(); };
})();
</script>
</body>
</html>
